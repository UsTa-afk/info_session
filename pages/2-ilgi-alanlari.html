<script>
  (() => {
    const cards = document.querySelectorAll('.topic-card');
    const counterPill = document.getElementById('selection-counter');
    const ctaBtn = document.getElementById('cta-next');

    // Update progress bar in shell header if element exists
    const stepBars = document.querySelectorAll('[role="progressbar"] [data-step]');
    if (stepBars.length >= 2) {
      stepBars[0].classList.add('bg-primary');
      stepBars[1].classList.remove('bg-surface-container-highest');
      stepBars[1].classList.add('bg-primary');
    }

    const updateUI = () => {
      const selected = document.querySelectorAll('.topic-card[data-selected="true"]');
      const count = selected.length;
      
      counterPill.textContent = `${count} seçildi`;
      if (count > 0) {
        counterPill.className = "px-3 py-1 rounded-full bg-primary text-on-primary font-label-md text-label-md font-semibold transition-all duration-300 scale-105 shadow-sm";
        ctaBtn.classList.remove('opacity-60');
      } else {
        counterPill.className = "px-3 py-1 rounded-full bg-surface-container-lowest text-primary font-label-md text-label-md font-semibold transition-all duration-300 scale-100 shadow-sm";
      }
    };

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const isSelected = card.getAttribute('data-selected') === 'true';
        card.setAttribute('data-selected', !isSelected);
        updateUI();
      });
    });

    updateUI();

    ctaBtn.addEventListener('click', () => {
      ctaBtn.classList.add('scale-95');
      setTimeout(() => ctaBtn.classList.remove('scale-95'), 150);
    });
  })();
</script></main><script src="../flow.js"></script></body></html>
